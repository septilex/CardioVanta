name: Vercel Linux Build Verification (no deploy)

# R3.1: builds the REAL Vercel project on Linux with `vercel pull` + `vercel build`.
# It never deploys: there is no `vercel deploy`, `--prod` or `--prebuilt` step.
# Triggers are manual or a push to a dedicated branch; pushes to main are not handled here.
on:
  workflow_dispatch:
  push:
    branches:
      - ci/vercel-linux-build

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: "59.26.0"   # pinned; published 2026-09-23
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  vercel-linux-build:
    runs-on: ubuntu-latest
    # Same environment as the deploy job, so the existing secret/variables are reused.
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python (production runtime, from api/.python-version)
        uses: actions/setup-python@v5
        with:
          python-version-file: "api/.python-version"

      - name: Install pinned Vercel CLI
        run: |
          npm install -g "vercel@${VERCEL_CLI_VERSION}"
          vercel --version

      - name: Pull real project settings (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN secret or VERCEL_ORG_ID / VERCEL_PROJECT_ID variables are missing"
            exit 1
          fi
          vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: vercel build (preview target, local build only)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -o pipefail
          vercel build --yes --target=preview --token "$VERCEL_TOKEN" 2>&1 | tee vercel-build.log

      - name: Inspect function bundle (size, resources, model load, no fallback)
        if: always()
        run: |
          python -m pip install -r api/requirements.txt httpx==0.28.1
          python scripts/ci/inspect_vercel_bundle.py --output .vercel/output \
            --build-log vercel-build.log --report bundle-report.json

      - name: Remove pulled environment files before upload
        if: always()
        run: rm -f .vercel/.env.* .vercel/project.json

      - name: Upload build log and bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-linux-build
          path: |
            vercel-build.log
            bundle-report.json
          if-no-files-found: warn
