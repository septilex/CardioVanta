name: CI Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          pip install -r requirements.txt -r backend/requirements.txt -r api/requirements.txt
          pip install pytest pip-audit

      - name: Verify Artifact Integrity
        run: |
          # Verify expected ML artifact files match approved baseline hashes
          python scripts/verify_artifact_integrity.py

      - name: Run ML Framework Pytest Suite
        run: |
          # Validates ML pipeline, model generation, and drift detection
          pytest tests/

      - name: Run Backend API Pytest Suite
        run: |
          # Validates backend FastAPI application, request schema, and security rules
          pytest backend/tests/

      - name: Run Security Audit (pip)
        run: |
          pip-audit -r requirements.txt -r backend/requirements.txt -r api/requirements.txt

  verify-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Run TypeScript Check
        run: |
          npx tsc --noEmit

      - name: Run Jest Tests
        run: |
          npm run test -- --passWithNoTests

      - name: Run Next.js Production Build
        run: |
          npm run build

      - name: Run Security Audit (npm)
        run: |
          npm audit --audit-level=high

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify-backend, verify-frontend]
    runs-on: ubuntu-latest
    environment: production
    concurrency: production-delivery
    outputs:
      DEPLOYMENT_URL: ${{ steps.deploy_step.outputs.deployment_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy to Vercel
        id: deploy_step
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN is missing. Please configure it in GitHub Environment Secrets."
            exit 1
          fi
          
          if [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::error::VERCEL_ORG_ID or VERCEL_PROJECT_ID is missing. Please configure them in GitHub Variables."
            exit 1
          fi
          
          DEPLOYMENT_URL=$(vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed github.sha ${{ github.sha }} to URL: $DEPLOYMENT_URL"

  verify-production:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Minimal Dependencies
        run: |
          pip install requests urllib3

      - name: Test Unique Deployment URL
        env:
          CARDIO_VANTA_AUDIT_URL: ${{ needs.deploy.outputs.DEPLOYMENT_URL }}
        run: |
          echo "Testing Deployment URL: $CARDIO_VANTA_AUDIT_URL"
          python audit_tests.py

      - name: Test Production Alias
        run: |
          echo "Testing Production Alias"
          python audit_tests.py
