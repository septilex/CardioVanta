name: CI Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Production runtime: the Python version Vercel deploys with (root .python-version).
  # Synthetic inputs only, enforced: quarantined files are absent from the checkout and the runtime
  # guard refuses (and logs) any Python access to them, including in subprocesses.
  verify-backend:
    name: Backend, ML package & contracts (production Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (research-data quarantine)
        # Sparse checkout keeps the locked Cleveland source, development indices, external cohorts and
        # locked-derived results off the runner (patterns generated by scripts/ci/data_quarantine.py).
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/*
            /data/external/raw/heart-disease.names
            !/experiments/results/error_analysis.json
            !/experiments/results/candidate_comparison.json
            !/experiments/results/nested_lda_evaluation.json
            !/experiments/results/nested_threshold_optimization.json
            !/experiments/results/nested_cv_90pct_results.json
            !/experiments/phase13/test_results.json
            !/experiments/phase13/tabicl_test_results.json
            !/reports/error_analysis.md
            !/reports/phase2c_final_evaluation.csv
            !/reports/phase2c_final_evaluation.json
            !/reports/phase2c_model_selection.json
            !/reports/model_baseline_results.csv
            !/reports/model_baseline_results.json
            !/reports/cardio_vanta_master_audit.md

      - name: Setup Python (from .python-version)
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: 'pip'
          cache-dependency-path: |
            api/requirements.txt
            backend/requirements.txt
            cardiovanta_ml/pyproject.toml

      - name: Install Backend and ML Package (documented path)
        run: |
          python -m pip install -r backend/requirements.txt -r api/requirements.txt
          python -m pip install "./cardiovanta_ml[test]"
          python -m pip install pip-audit

      - name: Enable Data Quarantine Guard
        # PYTHONDONTWRITEBYTECODE: importing modules that live in write-protected directories (e.g.
        # cardiovanta_ml/contracts) must not try to write __pycache__ files there; the guard would refuse
        # (and log) every such write. The protected-directory rules themselves are unchanged.
        run: |
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          echo "CARDIOVANTA_DATA_QUARANTINE=1" >> "$GITHUB_ENV"
          echo "CARDIOVANTA_QUARANTINE_LOG=$RUNNER_TEMP/data-quarantine.jsonl" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/scripts/ci/quarantine_site" >> "$GITHUB_ENV"

      - name: Verify Quarantine (checkout, static guard, test classification)
        run: |
          python scripts/ci/data_quarantine.py --assert-absent
          python scripts/ci/data_quarantine.py --check-sparse-checkout .github/workflows/verify.yml
          python scripts/ci/check_data_access.py
          python scripts/ci/test_classification.py --check

      - name: Verify Generated Contract Files Are Current
        run: python contracts/codegen/generate.py --check

      - name: Verify Artifact Integrity
        run: |
          # Verify expected ML artifact files match approved baseline hashes
          python scripts/verify_artifact_integrity.py

      - name: Build ML Package Wheel
        run: python -m pip wheel ./cardiovanta_ml --no-deps -w dist/

      - name: Install Wheel in Clean Venv and Verify Outside the Repository
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/cardiovanta_ml-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/ci/verify_wheel_install.py" \
            --registry-root "$GITHUB_WORKSPACE/artifacts" \
            --model-id cardiovanta-lr13 --model-version 1.0.0 \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Run Classified Safe Tests (backend synthetic suite and ci_safe research tests)
        env:
          CARDIOVANTA_RUN_INSTALL_TESTS: "1"
        run: |
          # Exactly the modules classified ci_safe in scripts/ci/test_classification.py
          python -m pytest $(python scripts/ci/test_classification.py --list ci_safe)

      - name: Run Security Audit (pip, production dependencies)
        run: |
          pip-audit -r api/requirements.txt -r backend/requirements.txt

      - name: Assert No Quarantined Access Was Attempted
        if: always()
        run: python scripts/ci/data_quarantine.py --assert-clean-log "$CARDIOVANTA_QUARANTINE_LOG"

  # Replaces the former broad `pytest tests/` research job, which read data/raw/heart.csv (including the
  # locked rows when splits were rebuilt), retrained models and rewrote research outputs. This job runs
  # only explicitly classified safe modules on the research dependency stack, under the same quarantine.
  # Modules classified research_data are never run in CI.
  quarantined-research-tests:
    name: Classified safe research tests (Python 3.11, research stack, quarantined)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (research-data quarantine)
        # Sparse checkout keeps the locked Cleveland source, development indices, external cohorts and
        # locked-derived results off the runner (patterns generated by scripts/ci/data_quarantine.py).
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/*
            /data/external/raw/heart-disease.names
            !/experiments/results/error_analysis.json
            !/experiments/results/candidate_comparison.json
            !/experiments/results/nested_lda_evaluation.json
            !/experiments/results/nested_threshold_optimization.json
            !/experiments/results/nested_cv_90pct_results.json
            !/experiments/phase13/test_results.json
            !/experiments/phase13/tabicl_test_results.json
            !/reports/error_analysis.md
            !/reports/phase2c_final_evaluation.csv
            !/reports/phase2c_final_evaluation.json
            !/reports/phase2c_model_selection.json
            !/reports/model_baseline_results.csv
            !/reports/model_baseline_results.json
            !/reports/cardio_vanta_master_audit.md

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Research Dependencies
        run: |
          pip install -r requirements.txt -r backend/requirements.txt -r api/requirements.txt
          pip install pytest==9.1.1 pip-audit

      - name: Enable Data Quarantine Guard
        # PYTHONDONTWRITEBYTECODE: importing modules that live in write-protected directories (e.g.
        # cardiovanta_ml/contracts) must not try to write __pycache__ files there; the guard would refuse
        # (and log) every such write. The protected-directory rules themselves are unchanged.
        run: |
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          echo "CARDIOVANTA_DATA_QUARANTINE=1" >> "$GITHUB_ENV"
          echo "CARDIOVANTA_QUARANTINE_LOG=$RUNNER_TEMP/data-quarantine.jsonl" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/scripts/ci/quarantine_site" >> "$GITHUB_ENV"

      - name: Verify Quarantine (checkout, static guard, test classification)
        run: |
          python scripts/ci/data_quarantine.py --assert-absent
          python scripts/ci/data_quarantine.py --check-sparse-checkout .github/workflows/verify.yml
          python scripts/ci/check_data_access.py
          python scripts/ci/test_classification.py --check

      - name: Run Classified Safe Tests on the Research Stack (Python 3.11)
        run: |
          python -m pytest $(python scripts/ci/test_classification.py --list ci_safe --list ci_safe_research_deps)

      - name: Run Security Audit (pip, research dependencies)
        run: |
          pip-audit -r requirements.txt

      - name: Assert No Quarantined Access Was Attempted
        if: always()
        run: python scripts/ci/data_quarantine.py --assert-clean-log "$CARDIOVANTA_QUARANTINE_LOG"

  verify-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (research-data quarantine)
        # Sparse checkout keeps the locked Cleveland source, development indices, external cohorts and
        # locked-derived results off the runner (patterns generated by scripts/ci/data_quarantine.py).
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/*
            /data/external/raw/heart-disease.names
            !/experiments/results/error_analysis.json
            !/experiments/results/candidate_comparison.json
            !/experiments/results/nested_lda_evaluation.json
            !/experiments/results/nested_threshold_optimization.json
            !/experiments/results/nested_cv_90pct_results.json
            !/experiments/phase13/test_results.json
            !/experiments/phase13/tabicl_test_results.json
            !/reports/error_analysis.md
            !/reports/phase2c_final_evaluation.csv
            !/reports/phase2c_final_evaluation.json
            !/reports/phase2c_model_selection.json
            !/reports/model_baseline_results.csv
            !/reports/model_baseline_results.json
            !/reports/cardio_vanta_master_audit.md

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Run TypeScript Check
        run: |
          npx tsc --noEmit

      - name: Run Jest Tests
        run: |
          npm run test -- --passWithNoTests

      - name: Run Next.js Production Build
        run: |
          npm run build

      - name: Run Security Audit (npm)
        run: |
          npm audit --audit-level=critical

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify-backend, quarantined-research-tests, verify-frontend]
    runs-on: ubuntu-latest
    environment: production
    concurrency: production-delivery
    outputs:
      DEPLOYMENT_URL: ${{ steps.deploy_step.outputs.deployment_url }}
    steps:
      - name: Checkout Code (research-data quarantine)
        # Sparse checkout keeps the locked Cleveland source, development indices, external cohorts and
        # locked-derived results off the runner (patterns generated by scripts/ci/data_quarantine.py).
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/*
            /data/external/raw/heart-disease.names
            !/experiments/results/error_analysis.json
            !/experiments/results/candidate_comparison.json
            !/experiments/results/nested_lda_evaluation.json
            !/experiments/results/nested_threshold_optimization.json
            !/experiments/results/nested_cv_90pct_results.json
            !/experiments/phase13/test_results.json
            !/experiments/phase13/tabicl_test_results.json
            !/reports/error_analysis.md
            !/reports/phase2c_final_evaluation.csv
            !/reports/phase2c_final_evaluation.json
            !/reports/phase2c_model_selection.json
            !/reports/model_baseline_results.csv
            !/reports/model_baseline_results.json
            !/reports/cardio_vanta_master_audit.md

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy to Vercel
        id: deploy_step
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          # Exact CLI version; must equal VERCEL_CLI_VERSION in vercel-linux-build.yml (regression-tested).
          VERCEL_CLI_VERSION: "59.26.0"
        run: |
          npm install -g "vercel@${VERCEL_CLI_VERSION}"
          vercel --version

          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN is missing. Please configure it in GitHub Environment Secrets."
            exit 1
          fi
          
          if [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::error::VERCEL_ORG_ID or VERCEL_PROJECT_ID is missing. Please configure them in GitHub Variables."
            exit 1
          fi
          
          DEPLOYMENT_URL=$(vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed github.sha ${{ github.sha }} to URL: $DEPLOYMENT_URL"

  verify-production:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (research-data quarantine)
        # Sparse checkout keeps the locked Cleveland source, development indices, external cohorts and
        # locked-derived results off the runner (patterns generated by scripts/ci/data_quarantine.py).
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/*
            /data/external/raw/heart-disease.names
            !/experiments/results/error_analysis.json
            !/experiments/results/candidate_comparison.json
            !/experiments/results/nested_lda_evaluation.json
            !/experiments/results/nested_threshold_optimization.json
            !/experiments/results/nested_cv_90pct_results.json
            !/experiments/phase13/test_results.json
            !/experiments/phase13/tabicl_test_results.json
            !/reports/error_analysis.md
            !/reports/phase2c_final_evaluation.csv
            !/reports/phase2c_final_evaluation.json
            !/reports/phase2c_model_selection.json
            !/reports/model_baseline_results.csv
            !/reports/model_baseline_results.json
            !/reports/cardio_vanta_master_audit.md

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Minimal Dependencies
        run: |
          pip install requests urllib3

      - name: Test Unique Deployment URL
        env:
          CARDIO_VANTA_AUDIT_URL: ${{ needs.deploy.outputs.DEPLOYMENT_URL }}
        run: |
          echo "Testing Deployment URL: $CARDIO_VANTA_AUDIT_URL"
          python audit_tests.py

      - name: Test Production Alias
        run: |
          echo "Testing Production Alias"
          python audit_tests.py
