name: CI Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Production runtime: the Python version Vercel deploys with (root .python-version).
  # Synthetic inputs only; no step in this job reads data/raw/heart.csv.
  verify-backend:
    name: Backend, ML package & contracts (production Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python (from .python-version)
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: 'pip'
          cache-dependency-path: |
            api/requirements.txt
            backend/requirements.txt
            cardiovanta_ml/pyproject.toml

      - name: Install Backend and ML Package (documented path)
        run: |
          python -m pip install -r backend/requirements.txt -r api/requirements.txt
          python -m pip install "./cardiovanta_ml[test]"
          python -m pip install pip-audit

      - name: Verify Generated Contract Files Are Current
        run: python contracts/codegen/generate.py --check

      - name: Verify Artifact Integrity
        run: |
          # Verify expected ML artifact files match approved baseline hashes
          python scripts/verify_artifact_integrity.py

      - name: Build ML Package Wheel
        run: python -m pip wheel ./cardiovanta_ml --no-deps -w dist/

      - name: Install Wheel in Clean Venv and Verify Outside the Repository
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/cardiovanta_ml-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/ci/verify_wheel_install.py" \
            --registry-root "$GITHUB_WORKSPACE/artifacts" \
            --model-id cardiovanta-lr13 --model-version 1.0.0 \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Run Synthetic Backend, Registry, Contract and Deployment Tests
        env:
          CARDIOVANTA_RUN_INSTALL_TESTS: "1"
        run: |
          # FastAPI app, request schema, security, R0.3 semantics, R1 contract, R2 registry,
          # R3 deployment checks, monitoring and artifact-integrity tests
          python -m pytest backend/tests/ tests/test_monitoring.py tests/test_artifact_integrity.py

      - name: Run Security Audit (pip, production dependencies)
        run: |
          pip-audit -r api/requirements.txt -r backend/requirements.txt

  # Research suites READ data/raw/heart.csv (including its locked rows when they rebuild
  # splits) and some retrain models in temporary directories. Kept separate from the
  # synthetic production checks; still a required gate, as before R3.
  research-data-tests:
    name: Data-dependent research suites (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Research Dependencies
        run: |
          pip install -r requirements.txt -r backend/requirements.txt -r api/requirements.txt
          pip install pytest==9.1.1 pip-audit

      - name: Run Research Pytest Suites (data-dependent)
        run: |
          pytest tests/ --ignore=tests/test_monitoring.py --ignore=tests/test_artifact_integrity.py

      - name: Run Synthetic Backend Suite on Python 3.11 (local-dev runtime)
        run: |
          pytest backend/tests/

      - name: Run Security Audit (pip, research dependencies)
        run: |
          pip-audit -r requirements.txt

  verify-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Run TypeScript Check
        run: |
          npx tsc --noEmit

      - name: Run Jest Tests
        run: |
          npm run test -- --passWithNoTests

      - name: Run Next.js Production Build
        run: |
          npm run build

      - name: Run Security Audit (npm)
        run: |
          npm audit --audit-level=critical

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify-backend, research-data-tests, verify-frontend]
    runs-on: ubuntu-latest
    environment: production
    concurrency: production-delivery
    outputs:
      DEPLOYMENT_URL: ${{ steps.deploy_step.outputs.deployment_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy to Vercel
        id: deploy_step
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN is missing. Please configure it in GitHub Environment Secrets."
            exit 1
          fi
          
          if [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::error::VERCEL_ORG_ID or VERCEL_PROJECT_ID is missing. Please configure them in GitHub Variables."
            exit 1
          fi
          
          DEPLOYMENT_URL=$(vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed github.sha ${{ github.sha }} to URL: $DEPLOYMENT_URL"

  verify-production:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Minimal Dependencies
        run: |
          pip install requests urllib3

      - name: Test Unique Deployment URL
        env:
          CARDIO_VANTA_AUDIT_URL: ${{ needs.deploy.outputs.DEPLOYMENT_URL }}
        run: |
          echo "Testing Deployment URL: $CARDIO_VANTA_AUDIT_URL"
          python audit_tests.py

      - name: Test Production Alias
        run: |
          echo "Testing Production Alias"
          python audit_tests.py
