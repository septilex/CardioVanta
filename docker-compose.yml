services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cardiovanta
      POSTGRES_USER: cardiovanta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env.docker first}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cardiovanta -d cardiovanta"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo:
    image: mongo:7
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:7
    depends_on:
      mongo: {condition: service_healthy}
    entrypoint: [mongosh, "mongodb://mongo:27017", --quiet, --eval]
    command:
      - "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }; while (!db.hello().isWritablePrimary) { sleep(500) }"
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: [.env.docker]
    depends_on:
      postgres: {condition: service_healthy}
      mongo-init: {condition: service_completed_successfully}
    command: [python, -m, backend.app.db.setup]
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: [.env.docker]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
  mongo_data:
  redis_data:
